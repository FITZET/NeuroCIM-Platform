name: Build direct Windows release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true

permissions:
  contents: read

jobs:
  initialize-release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.DISTRIBUTION_TOKEN }}
    steps:
      - name: Create private release target
        shell: bash
        run: |
          if [[ '${{ github.event_name }}' == 'workflow_dispatch' ]]; then version='${{ inputs.version }}'; else version='${{ github.ref_name }}'; version="${version#v}"; fi
          tag="v${version}"
          notes='Windows 11 CPU and NVIDIA GPU offline installers. Download the EXE and all matching BIN parts into one folder. The GPU build uses CUDA 11.8 and falls back to CPU when CUDA is unavailable.'
          if gh release view "$tag" --repo Lowpower-Lab/NeuroCIM-Distribution >/dev/null 2>&1; then
            gh release edit "$tag" --repo Lowpower-Lab/NeuroCIM-Distribution --title "NeuroCIM ${version}" --notes "$notes"
          else
            gh release create "$tag" --repo Lowpower-Lab/NeuroCIM-Distribution --title "NeuroCIM ${version}" --notes "$notes"
          fi

  build:
    needs: initialize-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: CPU
            slug: cpu
          - flavor: GPU
            slug: gpu
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.DISTRIBUTION_TOKEN }}
      NEUROCIM_GITHUB_CLIENT_ID: ${{ secrets.NEUROCIM_GITHUB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Resolve version
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}'.TrimStart('v') }
          "NEUROCIM_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r 5_NeuroCIM_opt/packaging/requirements-runtime.txt
          if ('${{ matrix.flavor }}' -eq 'CPU') {
            python -m pip install torch==2.4.0 torchvision==0.19.0 --index-url https://download.pytorch.org/whl/cpu
          } else {
            python -m pip install torch==2.4.0 torchvision==0.19.0 --index-url https://download.pytorch.org/whl/cu118
          }
          python -m pip install -r 5_NeuroCIM_opt/packaging/requirements-build.txt pytest==7.4.0
          choco install innosetup -y --no-progress
      - name: Download authenticated runtime resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force runtime-assets | Out-Null
          gh release download runtime-assets-v1 --repo Lowpower-Lab/NeuroCIM-Distribution --pattern 'runtime-assets.zip*' --dir runtime-assets
          if (-not (Test-Path -LiteralPath runtime-assets/runtime-assets.zip)) {
            $partsManifest = Get-ChildItem -LiteralPath runtime-assets -Filter 'runtime-assets.zip.parts.json' -File | Select-Object -First 1
            if ($null -eq $partsManifest) { throw 'Runtime assets archive or parts manifest is missing' }
            python 5_NeuroCIM_opt/scripts/manage_gpt2_large_resources.py assemble `
              --parts-manifest $partsManifest.FullName --output runtime-assets/runtime-assets.zip
            if ($LASTEXITCODE -ne 0) { throw 'Runtime assets parts failed SHA256 verification' }
          }
          Expand-Archive runtime-assets/runtime-assets.zip -DestinationPath . -Force
      - name: Build ${{ matrix.flavor }} installer
        shell: pwsh
        working-directory: 5_NeuroCIM_opt
        run: .\scripts\build_installer.ps1 -Flavor ${{ matrix.flavor }} -Version $env:NEUROCIM_VERSION -ClientId $env:NEUROCIM_GITHUB_CLIENT_ID
      - name: Upload ${{ matrix.flavor }} installer directly to release
        shell: pwsh
        run: |
          $root = Resolve-Path '5_NeuroCIM_opt/release/artifacts/${{ matrix.slug }}'
          $sourceManifest = Join-Path $root 'update-manifest.json'
          $flavorManifest = Join-Path $root 'update-manifest-${{ matrix.slug }}.json'
          Move-Item -LiteralPath $sourceManifest -Destination $flavorManifest -Force
          $files = Get-ChildItem -LiteralPath $root -File | Select-Object -ExpandProperty FullName
          gh release upload "v$env:NEUROCIM_VERSION" --repo Lowpower-Lab/NeuroCIM-Distribution --clobber $files

  finalize-release:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.DISTRIBUTION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Merge update manifests without Actions artifacts
        shell: bash
        run: |
          if [[ '${{ github.event_name }}' == 'workflow_dispatch' ]]; then version='${{ inputs.version }}'; else version='${{ github.ref_name }}'; version="${version#v}"; fi
          tag="v${version}"
          mkdir manifests
          gh release download "$tag" --repo Lowpower-Lab/NeuroCIM-Distribution --pattern 'update-manifest-*.json' --dir manifests
          python 5_NeuroCIM_opt/scripts/merge_update_manifests.py --output manifests/update-manifest.json manifests/update-manifest-cpu.json manifests/update-manifest-gpu.json
          gh release upload "$tag" --repo Lowpower-Lab/NeuroCIM-Distribution --clobber manifests/update-manifest.json
          gh release delete-asset "$tag" update-manifest-cpu.json --repo Lowpower-Lab/NeuroCIM-Distribution -y
          gh release delete-asset "$tag" update-manifest-gpu.json --repo Lowpower-Lab/NeuroCIM-Distribution -y
